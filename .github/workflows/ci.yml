name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Run flake8
        run: flake8 app tests

      - name: Run black --check
        run: black --check app tests

      - name: Run pytest
        run: pytest --maxfail=2 --disable-warnings

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t sports-stats-api .

      - name: Run Docker container
        run: |
          docker run -d -p 8000:8000 --name sports-stats-api sports-stats-api
          for i in {1..10}; do
            if curl -f http://localhost:8000/api/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for container..."
            sleep 3
          done
          echo "Health check failed!"
          docker logs sports-stats-api
          exit 1

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag sports-stats-api ${{ secrets.DOCKER_USERNAME }}/sports-stats-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sports-stats-api:latest